# ------------------------------------------------------------------------------------
# hosts.yaml — read only by the server, never exposed to the agent.
#
# The agent sees `alias` and `description`. It never sees hostname, username, key path,
# or port: it says host="web-01" and the server resolves it. That is what stops an agent
# from aiming this at a machine it was not granted.
#
# Keep this file mode 0600. `safereach doctor` warns if it is looser.
# ------------------------------------------------------------------------------------

defaults:
  # Production posture. With this on, the server refuses to start if any host below is
  # in client-only mode (require_shim: false) or resolves through ~/.ssh/config — the
  # weaker modes become a startup error, not a warning. Nothing the agent does can
  # change this file, which is what makes it a control.
  production: true
  port: 22
  connect_timeout: 10
  command_timeout: 30
  max_output_bytes: 65536
  known_hosts: ~/.ssh/known_hosts # NEVER null — that would disable host key checking
  audit_log: ~/.local/state/safereach/audit.jsonl

hosts:
  web-01:
    hostname: 10.0.1.5
    user: diag
    key: ~/.ssh/id_ed25519_diag
    description: "prod web frontend (nginx + app)"

    # Intersected with commands.yaml — a host can only ever narrow the global
    # allowlist, never widen it.
    allow:
      [journalctl, systemctl, dmesg, df, du, free, uptime, ps, ss, ip, tail, head, grep, stat, ls, docker, curl]

    # --- docker -----------------------------------------------------------------
    # Point at a READ-ONLY socket proxy, not /var/run/docker.sock. Membership of the
    # docker group is equivalent to root on the host, so the proxy is what keeps a
    # parser bug from becoming a host compromise. `enroll --hardened` starts one on a
    # unix socket readable by the diag group only and writes this value for you:
    docker_host: "unix:///run/safereach/docker.sock"
    # A TCP proxy (tcp://127.0.0.1:2375) also works; its port is then refused to curl
    # however curl_targets is written.

    # Container env values are masked by default — Config.Env is where DATABASE_URL and
    # *_TOKEN live, and `docker inspect` is a command the agent will call constantly.
    # Names listed here come back in the clear; everything else is masked. Keys stay
    # visible either way, so the agent can still reason about what is set.
    env_allowlist: [NODE_ENV, LOG_LEVEL, PORT, HOSTNAME]

    # --- curl -------------------------------------------------------------------
    # Entries are host:port. A bare host means ports 80 and 443 ONLY — it used to mean
    # every port on the box, which put the Docker API, Elasticsearch, Consul and whatever
    # else listens on loopback one GET away. Defaults to empty, meaning curl reaches
    # nothing. The docker_host port above is refused however this list is written.
    # Redirects are never followed.
    curl_targets: [localhost, 127.0.0.1, "localhost:8000"]
    curl_insecure: false # gates whether -k is accepted at all

    # --- elevated recipes -------------------------------------------------------
    # Fixed invocations the shim may run under sudo, selected by name. The agent sends
    # "dmesg-recent", never a command line. Each needs a matching exact-match entry in
    # /etc/sudoers.d/diag on the host.
    elevated: [dmesg-recent]

  db-01:
    hostname: 10.0.1.9
    user: diag
    key: ~/.ssh/id_ed25519_diag
    description: "primary postgres"
    allow: [journalctl, systemctl, df, du, free, uptime, ps, ss, tail, stat]
    # no docker, no curl, no elevated recipes on this host

  # A local container is the right way to try this out — see the README.
  test-local:
    hostname: 127.0.0.1
    port: 2222
    user: diag
    key: ~/.ssh/id_ed25519_diag
    description: "throwaway sshd container for testing"
    allow: [journalctl, systemctl, df, free, uptime, ps, ss, tail, docker, curl]
    docker_host: "tcp://127.0.0.1:2375"
    curl_targets: [localhost, 127.0.0.1]
    # Container exec is enabled on the HOST at enrolment, never here:
    #   safereach enroll test-local --hardened --allow-exec \
    #       --exec-container app --exec-path /app/storage/logs/
    # Both lists land in the host's root-owned policy file. Nothing on the wire can
    # widen them, and with no --exec-path the content-reading commands refuse everything.
