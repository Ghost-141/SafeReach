name: Publish

# Publishing is automatic, but only when the version actually changes.
#
# Publishing on every merge cannot work: PyPI versions are immutable, so the first merge
# that does not bump the version fails with "file already exists" and CI stays red from
# then on. Gating on a version change means merging a bump publishes, and merging
# anything else is silently a no-op.
#
# The full suite runs again here rather than trusting ci.yml. That is deliberate: it
# makes the job self-contained, removes a race between two workflows, and means nothing
# reaches PyPI without its tests having passed in the same run that uploaded it.

on:
  push:
    branches: [main]
    # Cheap pre-filter; the real decision is the version comparison below.
    paths: ["pyproject.toml"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: pypi
        type: choice
        options: [pypi, testpypi]

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous commit to compare against

      - id: check
        name: Publish only if the version changed and is not already on PyPI
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual run — publishing $VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS=$(git show HEAD~1:pyproject.toml 2>/dev/null \
                     | grep -m1 '^version = ' | cut -d'"' -f2 || echo "")
          if [ "$VERSION" = "$PREVIOUS" ]; then
            echo "version unchanged ($VERSION) — nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A version can be bumped on a branch and published manually before the merge
          # lands. Re-uploading would fail late and noisily; skipping is correct.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
                 "https://pypi.org/pypi/safereach/$VERSION/json")
          if [ "$CODE" != "404" ]; then
            echo "$VERSION is already on PyPI — nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version changed ${PREVIOUS:-none} -> $VERSION, publishing"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"

      # The spec linter first: it fails the build if the allowlist ever permits a
      # mutating verb, and that is the cheapest thing to learn early.
      - name: Spec linter
        run: uv run pytest tests/test_spec_lint.py -q
      - name: Full suite
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .

      - name: Build sdist and wheel
        run: uv build

      - name: README must render on PyPI
        run: uv run --with twine twine check dist/*

      # A wheel that imports but cannot find its packaged commands.yaml is useless, and
      # that only fails outside the source tree.
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/verify
          uv pip install --python /tmp/verify/bin/python dist/*.whl
          /tmp/verify/bin/safereach --version
          /tmp/verify/bin/safereach validate "journalctl -u nginx -n 5"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: [decide, build]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/safereach
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    needs: [decide, build]
    if: github.event_name == 'push' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/safereach
    permissions:
      id-token: write
      contents: write # for the release tag created below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }

      # Trusted Publishing: no stored token. GitHub mints a short-lived identity that
      # PyPI accepts only for this repository, workflow and environment. `attestations`
      # additionally binds the artifact to the commit that produced it, so a user can
      # verify what they are about to run against their own servers.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

      # Tagged only after a successful upload, so a tag always names something that is
      # actually installable.
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --title "v$VERSION" \
            --generate-notes
