name: End to end

# Enrols a disposable production-like host (systemd, sshd, sudo, nested dockerd) and
# replays the security review's probes against the real shim. Opt-in: it needs a
# privileged container and a few minutes, and it exercises root-level host changes, so it
# runs on demand and on pull requests that touch the code that writes to hosts.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/safereach/cli.py"
      - "src/safereach/ssh.py"
      - "shim/**"
      - "config/commands.yaml"
      - "tests/e2e/**"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"
      - name: End-to-end suite against a real host
        env:
          SAFEREACH_E2E: "1"
        run: uv run pytest tests/e2e -v
