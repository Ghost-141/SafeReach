[project]
name = "safereach"
version = "0.1.0"
description = "Read-only remote diagnostics over SSH, exposed as an MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ghost-141" }]
keywords = ["mcp", "ssh", "diagnostics", "observability", "sre"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "mcp>=2.1,<3",
    "asyncssh>=2.24",
    "pydantic>=2.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.6",
]

[project.scripts]
safereach = "safereach.cli:main"

[project.urls]
Homepage = "https://github.com/Ghost-141/SafeReach"
Repository = "https://github.com/Ghost-141/SafeReach"
Issues = "https://github.com/Ghost-141/SafeReach/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safereach"]

[tool.hatch.build.targets.wheel.force-include]
"config/commands.yaml" = "safereach/data/commands.yaml"
"config/hosts.example.yaml" = "safereach/data/hosts.example.yaml"
"shim/shim_main.py" = "safereach/data/shim_main.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
