[project]
name = "safereach"
version = "0.4.0"
description = "Read-only remote diagnostics over SSH, exposed as an MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ghost-141" }]
keywords = [
    "mcp", "mcp-server", "model-context-protocol", "ai-agents", "claude-code",
    "ssh", "diagnostics", "observability", "sre", "devops", "security", "read-only",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "mcp>=2.1,<3",
    "asyncssh>=2.24",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.6",
]

[project.scripts]
safereach = "safereach.cli:main"

[project.urls]
Homepage = "https://github.com/Ghost-141/SafeReach"
Repository = "https://github.com/Ghost-141/SafeReach"
Issues = "https://github.com/Ghost-141/SafeReach/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# README images are referenced by absolute URL, so the files themselves are not needed in
# either artifact; 6 MB of PNG has no business in an sdist.
[tool.hatch.build.targets.sdist]
exclude = ["diagram/"]

[tool.hatch.build.targets.wheel]
packages = ["src/safereach"]

[tool.hatch.build.targets.wheel.force-include]
"config/commands.yaml" = "safereach/data/commands.yaml"
"config/hosts.example.yaml" = "safereach/data/hosts.example.yaml"
"shim/shim_main.py" = "safereach/data/shim_main.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
